<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="个人相册，记录生活中的美好瞬间和珍贵回忆。">
  <meta name="keywords" content="个人相册,生活记录,美好瞬间,珍贵回忆">
  <title>个人相册 - 个人知识分享网站</title>
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="../utilities.css">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
  <style>
    /* 相册特定样式 */
    .gallery-header {
      text-align: center;
      margin-bottom: 3rem;
      animation: fadeIn 1s ease-out;
    }

    .gallery-header h1 {
      color: #2c3e50;
      margin-bottom: 1rem;
      font-size: 2.5rem;
      position: relative;
      display: inline-block;
    }
    
    .gallery-header h1::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 4px;
      background: linear-gradient(90deg, #3498db, #2c3e50);
      border-radius: 3px;
    }

    .gallery-header p {
      color: #7f8c8d;
      font-size: 1.2rem;
      max-width: 600px;
      margin: 2rem auto 0;
    }

    .slider-container {
      background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
      border-radius: 15px;
      padding: 3rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      margin-bottom: 3rem;
      border: 1px solid rgba(255,255,255,0.5);
      backdrop-filter: blur(10px);
    }

    .slider {
      width: 85%;
      margin: 0 auto;
      position: relative;
    }

    .slider img {
      width: 100%;
      height: 500px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    .slick-dots li button:before {
      color: #3498db;
      font-size: 12px;
    }

    .slick-dots li.slick-active button:before {
      color: #2c3e50;
    }

    .slick-prev:before, .slick-next:before {
      color: #3498db;
      font-size: 30px;
    }

    .slick-prev {
      left: -50px;
    }

    .slick-next {
      right: -50px;
    }

    /* 响应式设计 */
    @media (max-width: 1024px) {
      .slick-prev {
        left: -30px;
      }

      .slick-next {
        right: -30px;
      }
    }

    @media (max-width: 768px) {
      .slider {
        width: 100%;
      }
      
      .slider img {
        height: 350px;
      }
      
      .slider-container {
        padding: 2rem 1.5rem;
      }
      
      .gallery-header h1 {
        font-size: 2rem;
      }
      
      .slick-prev, .slick-next {
        display: none !important;
      }
    }

    @media (max-width: 480px) {
      .slider-container {
        padding: 1.5rem 1rem;
      }
      
      .slider img {
        height: 250px;
      }
      
      .gallery-header h1 {
        font-size: 1.8rem;
      }
      
      .gallery-header p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- 顶部导航栏 -->
  <header class="navbar">
    <div class="nav-container">
      <div class="logo">
        <h2>我的知识库</h2>
      </div>
      <nav class="nav-menu">
        <ul>
          <li><a href="../index.html">首页</a></li>
          <li><a href="../blog_space/blog.html">博客</a></li>
          <li><a href="../live_note/note&skills.html">笔记</a></li>
          <li><a href="photo.html">相册</a></li>
          <li><a href="#contact">联系</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- 主要内容区域 -->
  <main class="main-content">
    <!-- 面包屑导航 -->
    <div class="breadcrumb">
      <a href="../index.html">首页</a>
      <span>></span>
      <span class="current">相册</span>
    </div>
    
    <section class="gallery-header">
      <h1>我的相册</h1>
      <p>记录生活中的美好瞬间，每一帧都是珍贵的回忆</p>
    </section>
    
    <div class="slider-container">
      <div class="slider">
        <img src="Yoimiya1.jpg" alt="夏日烟花祭">
        <img src="Yoimiya2.jpg" alt="烟花艺术">
        <img src="Yoimiya3.png" alt="烟花设计师">
        <img src="Yoimiya4.jpg" alt="夏日回忆">
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2025 个人知识分享网站. 保留所有权利.</p>
  </footer>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
  <script>
    $(document).ready(function(){
      $('.slider').slick({
        autoplay: true,
        autoplaySpeed: 4000,
        dots: true,
        arrows: true,
        infinite: true,
        speed: 800,
        slidesToShow: 1,
        slidesToScroll: 1,
        fade: true,
        cssEase: 'linear',
        responsive: [
          {
            breakpoint: 768,
            settings: {
              arrows: false,
              dots: true
            }
          }
        ]
      });
    });
  </script>
</body>
</html>
