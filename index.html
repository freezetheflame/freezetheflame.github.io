<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的博客</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f5f5f5;
    }
    
    header {
      background: white;
      padding: 1rem 2rem;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 2rem;
      text-align: center;
    }
    
    h1 {
      color: #2c3e50;
      margin: 0;
    }
    
    .container {
      display: grid;
      grid-template-columns: 3fr 1fr;
      gap: 2rem;
    }
    
    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
    
    .main-content {
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .sidebar {
      background: white;
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .post-list {
      list-style: none;
      padding: 0;
    }
    
    .post-item {
      padding: 1rem 0;
      border-bottom: 1px solid #eee;
    }
    
    .post-item:last-child {
      border-bottom: none;
    }
    
    .post-title {
      font-size: 1.2rem;
      margin: 0 0 0.5rem 0;
    }
    
    .post-title a {
      color: #3498db;
      text-decoration: none;
    }
    
    .post-title a:hover {
      text-decoration: underline;
    }
    
    .post-meta {
      font-size: 0.9rem;
      color: #7f8c8d;
    }
    
    .tag {
      display: inline-block;
      background: #3498db;
      color: white;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      font-size: 0.8rem;
      margin-right: 0.3rem;
      margin-bottom: 0.3rem;
    }
    
    .section-title {
      color: #2c3e50;
      border-bottom: 2px solid #3498db;
      padding-bottom: 0.5rem;
      margin-top: 0;
    }
    
    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    
    .tag-link {
      color: #3498db;
      text-decoration: none;
      background: #f8f9fa;
      padding: 0.3rem 0.6rem;
      border-radius: 3px;
      font-size: 0.9rem;
    }
    
    .tag-link:hover {
      background: #3498db;
      color: white;
    }
    
    .search-box {
      margin-bottom: 1.5rem;
    }
    
    .search-box input {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ddd;
      border-radius: 3px;
      font-size: 1rem;
    }
    
    .cta-button {
      display: inline-block;
      background: #3498db;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 3px;
      text-decoration: none;
      margin-top: 1rem;
      font-weight: bold;
    }
    
    .cta-button:hover {
      background: #2980b9;
    }
  </style>
</head>
<body>
  <header>
    <h1>我的博客</h1>
    <p>记录学习与思考的地方</p>
  </header>
  
  <div class="container">
    <main class="main-content">
      <h2 class="section-title">最新文章</h2>
      <p>欢迎来到我的博客！这里会定期更新我的学习笔记和技术分享。</p>
      
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索文章...">
      </div>
      
      <ul class="post-list" id="postList">
        <li class="post-item">
          <h3 class="post-title"><a href="#">还没有文章</a></h3>
          <div class="post-meta">
            <span>请先创建一篇新文章</span>
          </div>
        </li>
      </ul>
      
      <a href="posts/index.html" class="cta-button">查看所有文章</a>
    </main>
    
    <aside class="sidebar">
      <h3 class="section-title">标签云</h3>
      <div class="tag-cloud" id="tagCloud">
        <span>暂无标签</span>
      </div>
      
      <h3 class="section-title">快速操作</h3>
      <p>使用以下命令创建新文章：</p>
      <pre>npm run create-post "文章标题"</pre>
      <p>或者：</p>
      <pre>make create-post</pre>
      
      <h3 class="section-title">关于</h3>
      <p>这是一个基于 Markdown 的简单博客系统，支持标签分类和全文搜索。</p>
    </aside>
  </div>
  
  <script>
    // Simple search functionality
    document.getElementById('searchInput').addEventListener('input', function(e) {
      const searchTerm = e.target.value.toLowerCase();
      const postItems = document.querySelectorAll('.post-item');
      
      postItems.forEach(item => {
        const text = item.textContent.toLowerCase();
        if (text.includes(searchTerm)) {
          item.style.display = 'block';
        } else {
          item.style.display = 'none';
        }
      });
    });
  </script>
</body>
</html>
